name: Pyomo Tests

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review, converted_to_draft ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyomo-scope:
    name: Pyomo scope
    runs-on: ubuntu-latest
    outputs:
      run_pyomo: ${{ steps.scope.outputs.run_pyomo }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Decide whether Pyomo validation is required
      id: scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        run_pyomo=false
        reason="not a Pyomo-sensitive change"

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          run_pyomo=true
          reason="manual dispatch"
        elif [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_DRAFT" = "true" ]; then
          reason="draft PR"
        elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          run_pyomo=true
          reason="$EVENT_NAME trigger without comparable base"
        else
          changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          while IFS= read -r path; do
            case "$path" in
              lyopronto/pyomo_models/**|\
              examples/example_pyomo_optimization.py|\
              examples/original_workflow_parity.py|\
              examples/current_main_comparison.py|\
              examples/current_main_optimizer_comparison.py|\
              examples/current_main_joint_optimizer_comparison.py|\
              examples/current_main_pressure_optimizer_comparison.py|\
              docs/examples/current_main_joint_optimizer_comparison.ipynb|\
              docs/examples/knownRp_PD.ipynb|\
              docs/examples/unknownRp_PD.ipynb|\
              examples/paper_optimal_control_replication.py|\
              examples/paper_gdp_validation.py|\
              docs/examples/paper_optimal_control_replication.ipynb|\
              docs/examples/dae_optimizer_walkthrough.ipynb|\
              docs/examples/pseudosteady_frozen_layer.ipynb|\
              benchmarks/results/pseudosteady_limit/**|\
              examples/pseudosteady_limit_study.py|\
              run_local_ci.sh|\
              tests/test_pseudosteady_frozen_layer.py|\
              tests/test_pseudosteady_limit_study.py|\
              tests/test_paper_optimal_control_replication.py|\
              tests/test_dae_optimizer_walkthrough.py|\
              tests/test_paper_gdp_validation.py|\
              tests/test_original_workflow_notebooks.py|\
              tests/test_pounce_solver_comparison.py|\
              tests/test_pyomo_models/**|\
              tests/test_current_main_optimizer_comparison.py|\
              tests/test_current_main_joint_optimizer_comparison.py|\
              tests/test_current_main_pressure_optimizer_comparison.py|\
              tests/test_pyomo_solver.py|\
              tests/pyomo_solver.py|\
              pyproject.toml|\
              .github/workflows/pyomo-tests.yml)
                run_pyomo=true
                reason="changed Pyomo-sensitive path: $path"
                break
                ;;
            esac
          done <<< "$changed_paths"
        fi

        echo "run_pyomo=$run_pyomo" >> "$GITHUB_OUTPUT"
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
        echo "Pyomo validation required: $run_pyomo ($reason)"

  pyomo-no-solver:
    name: Pyomo import and construction lane
    needs: pyomo-scope
    runs-on: ubuntu-latest

    steps:
    - name: Report skipped Pyomo validation
      if: ${{ needs.pyomo-scope.outputs.run_pyomo != 'true' }}
      run: |
        echo "Pyomo validation skipped: ${{ needs.pyomo-scope.outputs.reason }}"

    - uses: actions/checkout@v4
      if: ${{ needs.pyomo-scope.outputs.run_pyomo == 'true' }}

    - name: Read CI version config
      if: ${{ needs.pyomo-scope.outputs.run_pyomo == 'true' }}
      id: versions
      uses: mikefarah/yq@v4.44.1
      with:
        cmd: yq eval '.python-version' .github/ci-config/ci-versions.yml

    - name: Set up Python
      if: ${{ needs.pyomo-scope.outputs.run_pyomo == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.versions.outputs.result }}
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Install Pyomo test dependencies
      if: ${{ needs.pyomo-scope.outputs.run_pyomo == 'true' }}
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,pyomo]"

    - name: Run Pyomo no-solver tests
      if: ${{ needs.pyomo-scope.outputs.run_pyomo == 'true' }}
      run: |
        echo "Running Pyomo import, model-construction, and solver-skip tests"
        pytest tests/test_pyomo_models tests/test_pyomo_solver.py -n auto -v

  pyomo-solver-comparison:
    name: Pyomo solver lane
    # No job-level `if:`. This lane must report on every PR so that it can be
    # made a required status check, because a required check that never reports
    # leaves every PR pending forever. It therefore always runs and decides
    # internally whether there is anything to do, the same way
    # `pyomo-no-solver` does. Adding a job-level `if:` here re-breaks that and
    # is rejected by
    # tests/test_packaging_config.py::test_ci_workflows_use_documented_test_lane_expressions.
    needs: [pyomo-scope, pyomo-no-solver]
    runs-on: ubuntu-latest
    env:
      RUN_SOLVER: ${{ needs.pyomo-scope.outputs.run_pyomo == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}

    steps:
    - name: Report skipped solver validation
      if: ${{ env.RUN_SOLVER != 'true' }}
      run: |
        echo "Pyomo solver validation skipped: ${{ needs.pyomo-scope.outputs.reason }}"
        echo "(draft PRs and non-Pyomo changes do not need a solver run)"

    - uses: actions/checkout@v4
      if: ${{ env.RUN_SOLVER == 'true' }}

    - name: Read CI version config
      if: ${{ env.RUN_SOLVER == 'true' }}
      id: versions
      uses: mikefarah/yq@v4.44.1
      with:
        cmd: yq eval '.python-version' .github/ci-config/ci-versions.yml

    - name: Set up Python
      if: ${{ env.RUN_SOLVER == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.versions.outputs.result }}
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Install Pyomo test dependencies
      if: ${{ env.RUN_SOLVER == 'true' }}
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,pyomo]"

    - name: Install solver runtime libraries
      if: ${{ env.RUN_SOLVER == 'true' }}
      run: |
        sudo apt-get update
        sudo apt-get install --yes glpk-utils liblapack3

    # The version installed here is whatever IDAES currently ships (3.13.2 at
    # time of writing), which is not the version most contributors have
    # locally. A solve can land on a different iterate between IPOPT builds, so
    # assertions on solver output must be derived from a documented contract
    # (for example `bound_relax_factor * |bound|`) rather than pinned to a
    # number one build happens to produce. `ipopt -v` below records the version
    # in the log so a build-sensitive failure is diagnosable from the run alone.
    - name: Install Pyomo solver extensions
      if: ${{ env.RUN_SOLVER == 'true' }}
      run: |
        idaes get-extensions --extra petsc || {
          rc=$?
          echo "Failed to install IDAES solver extensions for the Pyomo lane."
          echo "Install IPOPT with: idaes get-extensions --extra petsc"
          echo "Alternative local install: conda install -c conda-forge ipopt"
          exit "$rc"
        }

    - name: Add IDAES solver binaries to PATH
      if: ${{ env.RUN_SOLVER == 'true' }}
      run: echo "$HOME/.idaes/bin" >> "$GITHUB_PATH"

    - name: Verify IPOPT is available
      if: ${{ env.RUN_SOLVER == 'true' }}
      run: |
        python -c "from pyomo.environ import SolverFactory; assert SolverFactory('ipopt').available(exception_flag=False), 'ipopt not on PATH'"
        ipopt -v

    - name: Verify GLPK is available
      if: ${{ env.RUN_SOLVER == 'true' }}
      run: |
        python -c "from pyomo.environ import SolverFactory; assert SolverFactory('glpk').available(exception_flag=False), 'glpsol not on PATH; install glpk-utils'"
        glpsol --version

    - name: Run Pyomo SciPy comparison tests
      if: ${{ env.RUN_SOLVER == 'true' }}
      run: |
        pytest -n 0 -v \
          tests/test_pyomo_models/test_single_step.py::test_single_step_solves_and_matches_scipy_reference \
          tests/test_pyomo_models/test_single_step.py::test_single_step_cold_start_solves_and_matches_scipy_reference \
          tests/test_pyomo_models/test_trajectory.py::test_trajectory_solves_and_matches_scipy_reference \
          tests/test_pyomo_models/test_trajectory.py::test_trajectory_cold_start_solves_and_matches_scipy_reference \
          tests/test_pyomo_models/test_original_workflow_parity.py \
          tests/test_original_workflow_notebooks.py \
          tests/test_pyomo_models/test_dae_optimization.py::test_dae_model_solves_to_complete_drying \
          tests/test_pyomo_models/test_dae_pressure_optimization.py::test_pressure_dae_model_solves_equivalent_complete_drying_problem \
          tests/test_pyomo_models/test_dae_joint_optimization.py::test_joint_dae_model_solves_equivalent_complete_drying_problem \
          tests/test_current_main_optimizer_comparison.py::test_current_main_comparison_helper_solves_smoke_case \
          tests/test_current_main_pressure_optimizer_comparison.py::test_current_main_pressure_comparison_helper_solves_smoke_case \
          tests/test_current_main_joint_optimizer_comparison.py::test_current_main_joint_comparison_helper_solves_smoke_case \
          tests/test_current_main_joint_optimizer_comparison.py::test_joint_pyomo_rate_limited_paper_extension_solves \
          tests/test_current_main_joint_optimizer_comparison.py::test_current_main_joint_comparison_notebook_execution \
          tests/test_pyomo_models/test_dae_joint_optimization.py::test_joint_dae_model_solves_rate_limited_extension \
          tests/test_pyomo_models/test_dae_shadow_prices.py \
          tests/test_pyomo_models/test_paper_ocp.py \
          tests/test_paper_optimal_control_replication.py \
          tests/test_dae_optimizer_walkthrough.py \
          tests/test_pseudosteady_frozen_layer.py \
          tests/test_pyomo_models/test_paper_gdp.py \
          tests/test_paper_gdp_validation.py

  pounce-solver-comparison:
    name: POUNCE solver lane
    # Keep this job reportable on every PR so it can become a required check
    # after its runner reliability has been observed. Pyomo-sensitive,
    # non-draft changes run the comparison; other PRs report a clean skip.
    needs: [pyomo-scope, pyomo-no-solver]
    runs-on: ubuntu-latest
    env:
      RUN_POUNCE: ${{ needs.pyomo-scope.outputs.run_pyomo == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}

    steps:
    - name: Report skipped POUNCE validation
      if: ${{ env.RUN_POUNCE != 'true' }}
      run: |
        echo "POUNCE validation skipped: ${{ needs.pyomo-scope.outputs.reason }}"
        echo "(draft PRs and non-Pyomo changes do not need a solver run)"

    - uses: actions/checkout@v4
      if: ${{ env.RUN_POUNCE == 'true' }}

    - name: Read CI version config
      if: ${{ env.RUN_POUNCE == 'true' }}
      id: pounce-versions
      uses: mikefarah/yq@v4.44.1
      with:
        cmd: yq eval '.python-version' .github/ci-config/ci-versions.yml

    - name: Set up Python
      if: ${{ env.RUN_POUNCE == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.pounce-versions.outputs.result }}
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Install POUNCE test dependencies
      if: ${{ env.RUN_POUNCE == 'true' }}
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev,pyomo,pounce]"

    - name: Install POUNCE comparison runtime libraries
      if: ${{ env.RUN_POUNCE == 'true' }}
      run: |
        sudo apt-get update
        sudo apt-get install --yes glpk-utils

    - name: Run POUNCE application comparison
      if: ${{ env.RUN_POUNCE == 'true' }}
      run: SKIP_INSTALL=1 ./run_local_ci.sh pounce
